<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>glosor</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#111214">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="brand">glosor</div>
  <nav>
    <button id="dir" title="Translation direction"></button>
    <button id="length" title="Text length"></button>
    <a href="#/">play</a>
    <a href="#/history">history</a>
    <a href="#/mistakes">mistakes</a>
  </nav>

  <main id="play">
    <p id="source" class="source" lang="sv"></p>
    <div class="box">
      <textarea id="answer" rows="3" spellcheck="false" autocomplete="off" placeholder=""></textarea>
      <a id="srclink" class="srclink" target="_blank" rel="noopener"></a>
    </div>
    <div id="result"></div>
    <p id="hint" class="hint"></p>
  </main>

  <main id="gate" hidden>
    <form id="gate-form" class="gate">
      <p class="source">glosor</p>
      <div id="gate-pw" class="gate-pw" hidden>
        <input id="gate-password" type="password" placeholder="password" autocomplete="current-password">
        <button id="gate-show" type="button" aria-controls="gate-password" aria-pressed="false">show</button>
      </div>
      <div id="gate-captcha"></div>
      <button id="gate-submit" type="submit">continue</button>
      <p id="gate-error" class="gate-error" role="alert"></p>
    </form>
  </main>

  <main id="history" hidden></main>
  <main id="mistakes" hidden></main>

  <script src="app.js" type="module"></script>
</body>
</html>
